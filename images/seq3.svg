eId, userId)</text><line stroke="black" x1="960" x2="720" y1="250" y2="250" /><polygon fill="black" points="720,250 730,246 730,254" /><text font-family="Arial" font-size="10px" x="760.0" y="245">Update OK</text><line stroke="black" x1="720" x2="720" y1="290" y2="290" /><polygon fill="black" points="720,290 730,286 730,294" /><text font-family="Arial" font-size="10px" x="640.0" y="285">Recalculate unread count</text><text font-family="Arial" font-size="10px" x="640.0" y="275">(optional)</text><line stroke="black" x1="720" x2="480" y1="330" y2="330" /><polygon fill="black" points="480,330 490,326 490,334" /><text font-family="Arial" font-size="10px" x="520.0" y="325">Result (new unreadCount)</text><line stroke="black" x1="480" x2="240" y1="370" y2="370" /><polygon fill="black" points="240,370 250,366 250,374" /><text font-family="Arial" font-size="10px" x="280.0" y="365">204 No Content</text><text font-family="Arial" font-size="10px" x="280.0" y="355">or 200 with new count</text></svg>